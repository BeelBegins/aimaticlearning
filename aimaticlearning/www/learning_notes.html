{% extends "templates/web.html" %}

{% block page_content %}
<div class="aimatic-learning-notes" id="chapter-{{ chapter_profile }}" data-focus="{{ focus | e }}" style="max-width:900px;margin:0 auto;padding:24px;">
	<style>
		.aimatic-learning-notes {
			user-select: none;
		}
		.aimatic-learning-notes .notes-body {
			line-height: 1.6;
			font-size: 16px;
		}
		.aimatic-learning-notes .notes-focus-target { border-left: 4px solid #c69a3b; border-radius: 4px; background: rgba(198, 154, 59, 0.12); box-shadow: 0 0 0 6px rgba(198, 154, 59, 0.08); }
		.aimatic-learning-notes .notes-banner {
			background: var(--fg-color);
			border: 1px solid var(--border-color);
			border-radius: 8px;
			padding: 12px 16px;
			margin-bottom: 16px;
			font-size: 13px;
		}
		@media (max-width: 620px) {
			.aimatic-learning-notes { padding: 18px 16px 36px !important; }
			.aimatic-learning-notes h2 { font-size: clamp(1.55rem, 7vw, 2rem); line-height: 1.15; overflow-wrap: anywhere; }
			.aimatic-learning-notes .notes-banner { padding: 12px 14px; font-size: 0.8rem; line-height: 1.5; }
			.aimatic-learning-notes .notes-body { font-size: 1rem; line-height: 1.72; overflow-wrap: anywhere; }
			.aimatic-learning-notes .notes-body table { display: block; max-width: 100%; overflow-x: auto; }
		}
	</style>
	<h2>{{ chapter_title }}</h2>
	<div class="notes-banner text-muted">
		Protected notes for reading. Download and export are disabled. Content is served only after enrolment checks.
	</div>
	<div class="notes-body">{{ notes_html | safe }}</div>
	<script>
	(function () {
		const host = document.getElementById("chapter-{{ chapter_profile }}");
		const focus = (host && host.dataset.focus ? host.dataset.focus : "").trim().toLowerCase();
		if (!host || !focus) return;
		const words = focus.split(/\s+/).filter(function (word) { return word.length > 3; });
		const target = Array.from(host.querySelectorAll("h2, h3, h4, p, li, blockquote, table")).find(function (node) {
			const value = (node.textContent || "").toLowerCase();
			return value.includes(focus) || (words.length && words.every(function (word) { return value.includes(word); }));
		});
		if (!target) return;
		target.classList.add("notes-focus-target");
		window.requestAnimationFrame(function () { target.scrollIntoView({ block: "center", behavior: "smooth" }); });
	})();
	</script>
</div>
{% endblock %}
